body.framed #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
body.framed #slot{position:relative;flex:none}
body.framed #wrap{position:relative;width:360px}
#bar{display:flex;align-items:center;gap:16px;width:min(560px,100%);padding:8px 8px 8px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 2px rgba(19,34,61,.06),0 6px 20px rgba(19,34,61,.08)}
.bar-t{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.3}
.bar-t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t span{font-size:12.5px;color:var(--ink2);line-height:1.4}
#snapBtn{flex:none;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 16px;border:0;border-radius:12px;background:var(--sun);color:#13223D;font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(19,34,61,.25)}
#snapBtn:hover{filter:brightness(1.04)}
#snapBtn:active{transform:translateY(1px);box-shadow:none}
#snapBtn:disabled{opacity:.6;cursor:progress}
#snapBtn:focus-visible{outline:3px solid #2161D8;outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#13223D;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:min(560px,90vw);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ---------- live data (Open-Meteo, no key needed) ---------- */
E.fetchLive=async function(lat,lon,place){
  const q='latitude='+lat+'&longitude='+lon;
  const u='https://api.open-meteo.com/v1/forecast?'+q+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max&wind_speed_unit=ms&timezone=auto&forecast_days=7';
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const tm=setTimeout(()=>{ctl&&ctl.abort();},10000);
  let j;
  try{const r=await fetch(u,ctl?{signal:ctl.signal}:{});if(!r.ok)throw new Error('http '+r.status);j=await r.json();}
  finally{clearTimeout(tm);}
  let air=null;
  try{const a=await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?'+q+'&current=pm10,pm2_5&timezone=auto');if(a.ok){const aj=await a.json();if(aj&&aj.current&&aj.current.pm10!=null)air={pm10:num(aj.current.pm10),pm25:num(aj.current.pm2_5)};}}catch(e){}
  return normalize(j,air,place);
};
function normalize(j,air,place){
  const c=j.current,H=j.hourly,Dy=j.daily;
  const ci=codeInfo(c.weather_code);
  const key=String(c.time).slice(0,13)+':00';
  let idx=H.time.indexOf(key);if(idx<0)idx=0;
  const hourly=[];
  for(let i=idx;i<Math.min(idx+25,H.time.length);i++){const hi=codeInfo(H.weather_code[i]);hourly.push({h:+String(H.time[i]).slice(11,13),temp:num(H.temperature_2m[i]),pop:num(H.precipitation_probability[i]),cond:hi[1],isDay:!!H.is_day[i]});}
  const daily=Dy.time.map((t,i)=>{const di=codeInfo(Dy.weather_code[i]);return{date:t,max:num(Dy.temperature_2m_max[i]),min:num(Dy.temperature_2m_min[i]),pop:num(Dy.precipitation_probability_max[i]),precip:num(Dy.precipitation_sum[i]),cond:di[1],desc:di[0]};});
  const t0=daily[0]||{max:0,min:0,pop:0,precip:0};
  return{live:true,at:Date.now(),place:place,
    now:{temp:num(c.temperature_2m),feels:num(c.apparent_temperature),humidity:num(c.relative_humidity_2m),wind:num(c.wind_speed_10m),windDir:num(c.wind_direction_10m),cloud:num(c.cloud_cover),pressure:num(c.pressure_msl),precip:num(c.precipitation),cond:ci[1],desc:ci[0],isDay:!!c.is_day},
    today:{max:t0.max,min:t0.min,pop:t0.pop,precip:t0.precip,uv:num(Dy.uv_index_max&&Dy.uv_index_max[0]),sunrise:String((Dy.sunrise&&Dy.sunrise[0])||'').slice(11,16),sunset:String((Dy.sunset&&Dy.sunset[0])||'').slice(11,16)},
    hourly:hourly,daily:daily,air:air};
}

const DESC={clear:'맑음',partly:'구름 조금',cloudy:'흐림',fog:'안개',rain:'비',snow:'눈',thunder:'천둥번개'};
const CLIM=[-2,0,6,12,18,22,26,27,22,15,7,0];
const SUNT=[['07:47','17:35'],['07:25','18:08'],['06:50','18:35'],['06:05','19:02'],['05:28','19:30'],['05:11','19:54'],['05:22','19:53'],['05:48','19:25'],['06:14','18:44'],['06:40','18:00'],['07:12','17:25'],['07:40','17:15']];
E.SCN_NAMES={clear:'맑음',cloudy:'흐림',rain:'비',snow:'눈',thunder:'천둥번개',night:'밤'};
E.demo=function(scn,place){
  const now=new Date(),mon=now.getMonth();
  let key=scn,night=false;
  if(scn==='night'){key='clear';night=true;}
  if(scn==='auto'||!SCN[key])key='partly';
  const S=Object.assign({},SCN[key]);
  if(scn==='auto'){S.m=CLIM[mon];}
  const realH=now.getHours();
  const isDayH=h=>h>=6&&h<19;
  let nowH=realH;
  if(night)nowH=21;else if(scn!=='auto'&&!isDayH(realH))nowH=13;
  const tAt=h=>S.m+S.a*Math.cos((h-15)/24*2*Math.PI);
  const hourly=[];
  for(let i=0;i<25;i++){const h=(nowH+i)%24;const pop=R((S.p[0]+(S.p[1]-S.p[0])*(0.5+0.5*Math.sin(i/2.3)))/10)*10;
    let cond=S.c;if(S.c==='partly'&&i%5===3)cond='clear';if(S.c==='clear'&&i%7===5)cond='partly';
    hourly.push({h:h,temp:+tAt(h).toFixed(1),pop:pop,cond:cond,isDay:isDayH(h)});}
  const off=[0,1,-1,-2,1,2,0];
  const daily=[];
  for(let i=0;i<7;i++){const dt=new Date(now.getTime()+i*864e5);const cond=S.days[i];const base=S.m+off[i];
    const wet=cond==='rain'||cond==='snow'||cond==='thunder';
    daily.push({date:ymd(dt),max:+(base+S.a+(cond==='clear'?1:0)).toFixed(1),min:+(base-S.a-1).toFixed(1),pop:i===0?S.p[1]:(wet?70+i%2*10:(cond==='cloudy'?30:10)),precip:i===0?S.pr:(wet?(cond==='thunder'?25:cond==='snow'?4:8+i):0),cond:cond,desc:DESC[cond]});}
  const t=+tAt(nowH).toFixed(1);
  const feels=(t>=25&&S.hu>=70)?t+2:(t<=10?t-1-S.w*0.6:t);
  return{live:false,at:Date.now(),place:place||'우리 동네',
    now:{temp:t,feels:+feels.toFixed(1),humidity:S.hu,wind:S.w,windDir:scn==='snow'?315:(key==='rain'?135:270),cloud:S.cc,pressure:S.ps,precip:S.pr>0?1.2:0,cond:S.c,desc:DESC[S.c],isDay:!night&&isDayH(nowH)},
    today:{max:daily[0].max,min:daily[0].min,pop:S.p[1],precip:S.pr,uv:S.uv,sunrise:SUNT[mon][0],sunset:SUNT[mon][1]},
    hourly:hourly,daily:daily,air:{pm10:S.pm[0],pm25:S.pm[1]}};
};

function rainSummary(d){
  const n=d.now,snowy=n.temp<1;
  if(n.cond==='snow')return '지금 눈이 내리고 있어요';
  if(n.cond==='rain'||n.cond==='thunder'||n.precip>0.1)return '지금 비가 내리고 있어요';
  const i=d.hourly.findIndex((x,k)=>k>0&&k<=12&&x.pop>=50);
  if(i>0)return hk(d.hourly[i].h)+'쯤 '+(snowy?'눈이나 비가':'비가')+' 올 수 있어요';
  if(d.today.pop>=40)return '오늘 '+(snowy?'눈이나 비가':'비가')+' 올 수도 있어요';
  return '오늘은 비 소식이 없어요';

function card(el,cls,style,inner){

  return '<div class="w st-'+(p.style||'glass')+' '+cls+'" style="--acc:'+a[1]+';--accfg:'+a[2]+';--acchot:'+a[3]+';--acccool:'+a[4]+';--acchair:'+(a[2]==='#fff'?'rgba(255,255,255,.28)':'rgba(58,42,0,.2)')+';'+(style||'')+'">'+inner+'</div>';
}
function smooth(P){
  if(P.length<2)return '';
  let d='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    d+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+','+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+','+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);}
  return d;
}
const range=(arr,minSpan)=>{let mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr);if(mx-mn<minSpan){const c=(mx+mn)/2;mn=c-minSpan/2;mx=c+minSpan/2;}return[mn,mx];};
const nest=(x,y,s,cond,isDay)=>'<svg x="'+x.toFixed(1)+'" y="'+y+'" width="'+s+'" height="'+s+'" viewBox="0 0 64 64">'+iconInner(cond,isDay)+'</svg>';

function hLine(el,d){

  const pts=[];for(let i=0;i<n;i++){const h=d.hourly[i*step];if(h)pts.push(h);}
  const W=300,x0=14,x1=W-14,yT=24,yB=70;const rg=range(pts.map(p=>p.temp),4);
  const X=i=>x0+i*(x1-x0)/Math.max(1,pts.length-1),Y=t=>yB-(t-rg[0])/(rg[1]-rg[0])*(yB-yT);
  const P=pts.map((p,i)=>[X(i),Y(p.temp)]);const path=smooth(P);
  const every=pts.length>12?2:1;
  let s='<path d="'+path+' L'+P[P.length-1][0].toFixed(1)+','+(yB+10)+' L'+P[0][0].toFixed(1)+','+(yB+10)+' Z" style="fill:var(--hot);opacity:.18"/>';
  s+='<path d="'+path+'" style="fill:none;stroke:var(--hot);stroke-width:2.6;stroke-linecap:round"/>';

}

function wChart(el,d){
  const n=+(el.props&&el.props.days)||5;const ds=d.daily.slice(0,n);
  const W=300,x0=22,x1=W-22;const X=i=>x0+i*(x1-x0)/Math.max(1,ds.length-1);
  const rg=range(ds.map(x=>x.max).concat(ds.map(x=>x.min)),6);const Y=t=>96-(t-rg[0])/(rg[1]-rg[0])*70;
  const mxP=Math.max(5,Math.max.apply(null,ds.map(x=>x.precip)));
  let s='';
  ds.forEach((x,i)=>{const hh=x.precip>0?Math.max(3,x.precip/mxP*20):0;const cx=X(i);
    if(hh)s+='<rect x="'+(cx-9).toFixed(1)+'" y="'+(152-hh).toFixed(1)+'" width="18" height="'+hh.toFixed(1)+'" rx="4" style="fill:var(--cool);opacity:.8"/>';
    s+='<text x="'+cx.toFixed(1)+'" y="'+(hh?152-hh-4:148).toFixed(1)+'" text-anchor="middle" class="ct-s">'+(x.precip>0?fmt1(x.precip):'0')+'</text>';
    s+='<text x="'+cx.toFixed(1)+'" y="170" text-anchor="middle" class="ct-l" style="font-weight:700">'+dayLabel(i,x.date)+'</text>';});
  s+='<line x1="8" y1="152.5" x2="'+(W-8)+'" y2="152.5" style="stroke:currentColor;opacity:.25"/>';
  const PM=ds.map((x,i)=>[X(i),Y(x.max)]),Pn=ds.map((x,i)=>[X(i),Y(x.min)]);
  s+='<path d="'+smooth(PM)+'" style="fill:none;stroke:var(--hot);stroke-width:2.6"/><path d="'+smooth(Pn)+'" style="fill:none;stroke:var(--cool);stroke-width:2.6"/>';
  ds.forEach((x,i)=>{s+='<circle cx="'+PM[i][0].toFixed(1)+'" cy="'+PM[i][1].toFixed(1)+'" r="3.2" style="fill:var(--hot)"/><text x="'+PM[i][0].toFixed(1)+'" y="'+(PM[i][1]-8).toFixed(1)+'" text-anchor="middle" class="ct-v">'+R(x.max)+'°</text><circle cx="'+Pn[i][0].toFixed(1)+'" cy="'+Pn[i][1].toFixed(1)+'" r="3.2" style="fill:var(--cool)"/><text x="'+Pn[i][0].toFixed(1)+'" y="'+(Pn[i][1]+16).toFixed(1)+'" text-anchor="middle" class="ct-v">'+R(x.min)+'°</text>';});
  return card(el,'ch','width:328px','<div class="c-h">'+n+'일 동안의 기온과 강수량</div><div class="lg"><span><i style="background:var(--hot)"></i>최고 기온</span><span><i style="background:var(--cool)"></i>최저 기온</span><span><i class="lg-b"></i>강수량(mm)</span></div><svg class="chart" viewBox="0 0 '+W+' 176" width="'+W+'" height="176">'+s+'</svg>');
}

E.METRICS={temp:'기온',feels:'체감 온도',humidity:'습도',wind:'바람',cloud:'구름의 양',precip:'강수량',pressure:'기압',uv:'자외선',pm:'미세먼지',sun:'일출과 일몰'};
function statInfo(m,d){
  const n=d.now,t=d.today;
  switch(m){
    case 'temp':return{lb:'기온',ic:'🌡️',v:R(n.temp),u:'°C',note:'최고 '+R(t.max)+'° / 최저 '+R(t.min)+'°',f:cl((n.temp+10)/50),col:'var(--hot)'};
    case 'feels':{const df=n.feels-n.temp;return{lb:'체감 온도',ic:'🧍',v:R(n.feels),u:'°C',note:Math.abs(df)<1?'실제 기온과 비슷하게 느껴져요':df>0?'실제보다 '+R(df)+'° 덥게 느껴져요':'실제보다 '+R(-df)+'° 춥게 느껴져요',f:cl((n.feels+10)/50),col:'var(--hot)'};}
    case 'humidity':return{lb:'습도',ic:'💧',v:R(n.humidity),u:'%',note:humWord(n.humidity),f:cl(n.humidity/100),col:'var(--cool)'};
    case 'wind':return{lb:'바람',ic:arrow(n.windDir),v:n.wind.toFixed(1),u:'m/s',note:dirName(n.windDir)+'풍, '+windWord(n.wind),f:cl(n.wind/14),col:'var(--cool)'};
    case 'cloud':{const tn=R(n.cloud/10);return{lb:'구름의 양',ic:'☁️',v:tn,u:'/10',note:cloudWord(tn),f:tn/10,col:'var(--cool)'};}
    case 'precip':return{lb:'강수량',ic:'☔',v:fmt1(t.precip),u:'mm',note:'오늘 비 올 확률 '+R(t.pop)+'%',f:cl(t.precip/30),col:'var(--cool)'};
    case 'pressure':{const p=n.pressure;return{lb:'기압',ic:p>=1013?'<b class="hl hi">고</b>':'<b class="hl lo">저</b>',v:R(p),u:'hPa',note:p>=1016?'고기압: 맑은 날이 많아요':p<=1008?'저기압: 흐리거나 비가 오기 쉬워요':'보통 기압이에요',f:cl((p-990)/40),col:'var(--cool)'};}
    case 'uv':return{lb:'자외선',ic:'🔆',v:R(t.uv),u:'',note:'자외선 '+uvWord(t.uv),f:cl(t.uv/11),col:'var(--hot)'};
    case 'pm':{if(!d.air)return{lb:'미세먼지',ic:'😶',v:'-',u:'',note:'정보를 받지 못했어요',f:0,col:'var(--cool)'};const g=pmGrade(d.air);return{lb:'미세먼지',ic:PMIC[g],v:PMW[g],u:'',note:'PM10 '+R(d.air.pm10)+' / PM2.5 '+R(d.air.pm25),f:(g+1)/4,col:PMC[g],word:true};}
    case 'sun':return{lb:'일출과 일몰',ic:'🌅',v:t.sunrise||'-',u:'',note:(t.sunset||'-')+'에 해가 져요',f:sunFrac(t),col:'var(--hot)',word:true};
  }
  return{lb:'?',ic:'',v:'-',u:'',note:'',f:0,col:'var(--cool)'};
}
E.statInfo=statInfo;
function stat(el,d){
  const m=(el.props&&el.props.metric)||'humidity';const S=statInfo(m,d);
  if(el.variant==='gauge'){const r=36,C=2*Math.PI*r,off=C*(1-S.f);
    return card(el,'st-g','width:156px','<div class="t-h"><span class="t-ic">'+S.ic+'</span>'+S.lb+'</div><div class="g-w"><svg viewBox="0 0 96 96" width="96" height="96" aria-hidden="true"><circle cx="48" cy="48" r="'+r+'" style="fill:none;stroke:currentColor;stroke-width:9;opacity:.16"/><circle cx="48" cy="48" r="'+r+'" transform="rotate(-90 48 48)" style="fill:none;stroke:'+S.col+';stroke-width:9;stroke-linecap:round;stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+off.toFixed(1)+'"/></svg><div class="g-v'+(S.word?' g-word':'')+'">'+S.v+'<small>'+S.u+'</small></div></div><div class="t-n sub">'+S.note+'</div>');}
  if(el.variant==='bar')return card(el,'st-b','width:328px','<div class="b-row"><div class="t-h"><span class="t-ic">'+S.ic+'</span>'+S.lb+'</div><div class="b-m"><i style="width:'+(S.f*100).toFixed(0)+'%;background:'+S.col+'"></i></div><div class="b-v">'+S.v+'<small>'+S.u+'</small></div></div><div class="t-n sub">'+S.note+'</div>');
  return card(el,'st-t','width:156px','<div class="t-h"><span class="t-ic">'+S.ic+'</span>'+S.lb+'</div><div class="t-v'+(S.word?' t-word':'')+'">'+S.v+'<small>'+S.u+'</small></div><div class="t-n sub">'+S.note+'</div>');
}

const OUT=[[28,'🎽🩳🧢','민소매, 반팔, 반바지','민소매나 반팔, 반바지를 입어요','28° 이상'],[23,'👕🩳','반팔, 얇은 셔츠, 반바지','반팔과 반바지가 딱 좋아요','23~27°'],[20,'👚👖','얇은 긴팔, 가디건, 긴바지','얇은 긴팔이나 가디건을 입어요','20~22°'],[17,'🧶👖','맨투맨, 얇은 니트, 긴바지','맨투맨이나 얇은 니트를 입어요','17~19°'],[12,'🧥👖','재킷, 가디건, 청바지','재킷이나 가디건을 챙겨요','12~16°'],[9,'🧥🧣','점퍼, 트렌치코트, 겹쳐 입기','점퍼를 입고 겹쳐 입어요','9~11°'],[5,'🧥🧤','코트, 두꺼운 점퍼, 내복','코트나 두꺼운 점퍼를 입어요','5~8°'],[-99,'🧥🧣🧤','패딩, 목도리, 장갑','패딩에 목도리, 장갑까지 챙겨요','4° 이하']];
const band=avg=>{for(let i=0;i<OUT.length;i++)if(avg>=OUT[i][0])return i;return OUT.length-1;};
const emj=s=>Array.from(s).map(c=>'<span>'+c+'</span>').join('');
function outfit(el,d){
  const t=d.today,avg=(t.max+t.min)/2,b=band(R(avg)),O=OUT[b];
  const wet=t.pop>=40||d.now.cond==='rain'||d.now.cond==='thunder'||d.now.cond==='snow';
  const extra=(wet?'<div class="of-x">☂️ '+(d.now.cond==='snow'?'눈':'비')+'가 올 수 있어요. 우산을 챙겨요</div>':'')+((t.max-t.min)>=10?'<div class="of-x">🧥 일교차가 커요. 겉옷을 챙겨요</div>':'');
  if(el.variant==='bubble')return card(el,'of-bub','width:300px','<div class="of-em sm">'+emj(O[1])+(wet?'<span>☂️</span>':'')+'</div><div class="of-say">'+O[3]+'</div><div class="sub of-avg">오늘 평균 기온 '+R(avg)+'°</div><i class="of-tail"></i>');
  if(el.variant==='ladder'){let s='';OUT.forEach((o,i)=>{s+='<div class="ol-r'+(i===b?' on':'')+'"><span class="ol-t">'+o[4]+'</span><span class="ol-e">'+o[1]+'</span><span class="ol-x">'+o[2]+'</span></div>';});
    return card(el,'of-lad','width:328px','<div class="c-h">기온별 옷차림<span class="sub">오늘 평균 '+R(avg)+'°</span></div>'+s);}
  return card(el,'of-card','width:328px','<div class="c-h">오늘의 옷차림<span class="sub">평균 기온 '+R(avg)+'°</span></div><div class="of-row"><div class="of-em">'+emj(O[1])+'</div><div class="of-tx">'+O[2]+'</div></div>'+extra);
}

function outdoorScore(d){
  const n=d.now,t=d.today;let s=100;
  if(n.cond==='thunder')s-=60;
  if(t.pop>=60||n.cond==='rain'||n.cond==='snow')s-=40;else if(t.pop>=30)s-=15;
  const avg=(t.max+t.min)/2;if(avg<15)s-=(15-avg)*3;if(avg>24)s-=(avg-24)*4;
  s-=[0,5,25,45][d.air?pmGrade(d.air):0];if(t.uv>=8)s-=10;if(n.wind>=9)s-=15;
  return Math.max(0,Math.min(100,R(s)));
}
function tipsOf(d){
  const n=d.now,t=d.today,g=d.air?pmGrade(d.air):0,L=[];
  if(n.cond==='thunder')L.push(['⚡','천둥번개가 쳐요. 실내에 있어요']);
  if(t.pop>=60||n.cond==='rain')L.push(['☂️','비가 와요. 우산을 꼭 챙겨요']);else if(t.pop>=30)L.push(['🌂','비가 올 수도 있어요. 작은 우산을 챙겨요']);
  if(n.cond==='snow')L.push(['⛄','눈길이 미끄러워요. 천천히 걸어요']);
  if(t.max>=33)L.push(['🥵','폭염이에요. 물을 자주 마시고 그늘에서 쉬어요']);else if(t.max>=28)L.push(['💧','더워요. 물을 자주 마셔요']);
  if(t.min<=0)L.push(['🧤','추워요. 장갑과 목도리를 챙겨요']);
  if(t.max-t.min>=10)L.push(['🧥','일교차가 커요. 겉옷을 챙겨요']);
  if(g>=2)L.push(['😷','미세먼지가 나빠요. 마스크를 써요']);
  if(t.uv>=6)L.push(['🧢','자외선이 강해요. 모자와 선크림을 챙겨요']);
  if(n.wind>=9)L.push(['🌬️','바람이 강해요. 간판과 나무 근처를 조심해요']);
  if(n.cond==='fog')L.push(['🌫️','안개가 꼈어요. 길을 건널 때 조심해요']);
  if(n.humidity<=35&&t.pop<30)L.push(['🔥','공기가 건조해요. 불조심해요']);
  if(t.pop<20&&n.humidity<65&&n.cond!=='fog')L.push(['👕','빨래가 잘 마르는 날이에요']);
  if(outdoorScore(d)>=75)L.push(['🏃','밖에서 뛰어놀기 좋은 날이에요']);
  if(!L.length)L.push(['🙂','오늘은 평범한 날씨예요']);
  return L;
}
function tips(el,d){
  const L=tipsOf(d);
  if(el.variant==='bubble')return card(el,'tp-bub','width:300px','<div class="tp-big">'+L[0][0]+'</div><div class="tp-say">'+L[0][1]+'</div>');
  if(el.variant==='score'){const sc=outdoorScore(d),w=sc>=75?'아주 좋아요':sc>=50?'괜찮아요':sc>=25?'조심해요':'실내 활동을 추천해요';
    const a=Math.PI*(1-sc/100),x=(60+46*Math.cos(a)).toFixed(1),y=(60-46*Math.sin(a)).toFixed(1);
    const col=sc>=75?'#22A55B':sc>=50?'#3B82F6':sc>=25?'#F08A24':'#E5484D';
    return card(el,'tp-sc','width:328px','<svg viewBox="0 0 120 70" width="120" height="70" aria-hidden="true"><path d="M14 60a46 46 0 0 1 92 0" style="fill:none;stroke:currentColor;stroke-width:10;stroke-linecap:round;opacity:.16"/><path d="M14 60A46 46 0 0 1 '+x+' '+y+'" style="fill:none;stroke:'+col+';stroke-width:10;stroke-linecap:round"/><text x="60" y="58" text-anchor="middle" style="fill:currentColor;font-size:22px;font-weight:700;font-family:inherit">'+sc+'</text></svg><div><div class="sub tp-l">야외 활동 지수</div><div class="tp-w">'+w+'</div><div class="tp-s">'+L[0][0]+' '+L[0][1]+'</div></div>');}
  return card(el,'tp-chk','width:328px','<div class="c-h">오늘의 생활 도움말</div>'+L.slice(0,4).map(x=>'<div class="tp-r"><span class="tp-e">'+x[0]+'</span><span>'+x[1]+'</span></div>').join(''));
}

function charLine(d){
  const n=d.now,g=d.air?pmGrade(d.air):0;
  if(n.cond==='thunder')return '천둥번개! 실내에 있자';
  if(n.cond==='rain')return '비가 와요. 우산 꼭 챙겨!';
  if(n.cond==='snow')return '눈이 와요! 미끄럼 조심해';
  if(g>=2)return '먼지가 많아요. 마스크 챙겨!';
  if(n.cond==='fog')return '안개가 꼈어요. 길 조심!';
  if(!n.isDay)return '별이 보이는 밤이에요. 잘 자요';
  if(n.temp>=28)return '덥다 더워! 물 많이 마셔요';
  if(n.temp<=5)return '추워요! 따뜻하게 입어요';
  if(n.cond==='cloudy')return '구름이 많은 날이에요';
  return '햇살 좋은 날! 밖에서 놀자';
}
function charSvg(kind,d){

  else{body='<g transform="translate(-4 2) scale(2)"><path d="'+CLOUD+'" fill="#FFFFFF" stroke="#98ADC4" stroke-width="1.2" stroke-linejoin="round"/></g>';fx=58;fy=68;}

  let face='';

const H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

var E=window.WXE,D;
try{D=JSON.parse(document.getElementById('wx-design').textContent);}catch(e){D={els:[]};}
if(!D||!Array.isArray(D.els))D={els:[]};
var L=D.loc,city=E.city(D.city);
var loc=(L&&isFinite(+L.lat)&&isFinite(+L.lon))?{lat:+L.lat,lon:+L.lon,place:String(L.n||'우리 동네')}:{lat:city[2],lon:city[3],place:city[1]};
var KEY='wxapp:cache:'+loc.lat+','+loc.lon+(D.useGeo?':geo':'');
var data=null,mode='demo',lastLoad=0,loading=false,framed=null,busy=false;
var $=function(id){return document.getElementById(id);};
var cv=$('cv'),wrap=$('wrap'),bg=$('bg'),els=$('els'),foot=$('foot'),screen=$('screen'),scroller=$('scroller'),slot=$('slot'),phone=$('phone'),bar=$('bar');
var meta=document.querySelector('meta[name="theme-color"]');
var appName=D.appName||'우리 날씨 앱';
document.title=appName;$('barName').textContent=appName;
if(D.pages>1)scroller.classList.add('multi');
function fit(){
  var H=E.pageH(D),w=document.documentElement.clientWidth||innerWidth,h=innerHeight;
  var fr=w>=700&&h>=560;
  if(fr!==framed){framed=fr;document.body.classList.toggle('framed',fr);document.body.classList.toggle('full',!fr);paintPage();}
  cv.style.height=H+'px';
  if(framed){
    cv.style.transform='';wrap.style.width='360px';wrap.style.height=H+'px';
    bg.style.setProperty('--bw','360px');
    var bh=bar.offsetHeight||58;
    var K=Math.max(.35,Math.min((h-48-16-bh)/764,(w-48)/384,1.3));
    slot.style.width=(384*K)+'px';slot.style.height=(764*K)+'px';phone.style.transform='scale('+K+')';
  }else{
    var k=D.pages>1?Math.min(w/360,1.6):Math.min(w/360,h/740);
    k=Math.max(.4,k);
    cv.style.transform='scale('+k+')';
    wrap.style.width=(360*k)+'px';wrap.style.height=(H*k)+'px';
    bg.style.setProperty('--bw',Math.min(w,h*.75)+'px');
    slot.style.width='';slot.style.height='';phone.style.transform='';
  }
}
var B=null;
function paintPage(){
  if(!B)return;
  var c=framed?'':B.base;
  document.documentElement.style.background=c;document.body.style.background=c;
}
function cur(){var d=data||E.demo('auto',loc.place);if(mode==='demo')d.place=loc.place;return d;}
function render(){
  var d=cur();
  B=E.bg(D,d);
  screen.style.cssText=B.vars+';--wf:'+E.fontStack(D.font);
  screen.classList.toggle('lightbg',!B.dark);
  paintPage();
  bg.style.background=B.css;bg.innerHTML=B.deco;
  if(meta)meta.setAttribute('content',B.base);
  els.innerHTML=E.elsHTML(D,d);
  foot.textContent=E.foot(mode,d);
  var st=screen.querySelector('.sbT');if(st)st.textContent=E.hm();
  var sub=mode==='live'?loc.place+' 실시간 날씨 ('+E.timeStr(d.at)+' 기준)':mode==='cache'?'마지막으로 받은 날씨 ('+E.timeStr(d.at)+')':'예시 날씨 (인터넷에 연결되면 실시간 날씨로 바뀌어요)';
  if(D.pages>1)sub+='. 마우스 휠로 아래 화면도 볼 수 있어요';
  $('barSub').textContent=sub;
}
function getPos(){
  return new Promise(function(res){
    if(!D.useGeo||!navigator.geolocation){res(loc);return;}
    var done=false;var t=setTimeout(function(){if(!done){done=true;res(loc);}},9000);
    navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(t);
      loc={lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3),place:'현재 위치'};res(loc);},
      function(){if(done)return;done=true;clearTimeout(t);res(loc);},{timeout:8000,maximumAge:1800000});
  });
}
function readCache(){try{var c=JSON.parse(localStorage.getItem(KEY)||'null');if(c&&c.now&&c.hourly)return c;}catch(e){}return null;}
function load(){
  if(loading)return;loading=true;lastLoad=Date.now();
  getPos().then(function(p){return E.fetchLive(p.lat,p.lon,p.place);}).then(function(d){
    data=d;mode='live';try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}
  }).catch(function(){
    if(mode!=='live'){var c=readCache();if(c){data=c;mode='cache';}else{data=null;mode='demo';}}
  }).then(function(){loading=false;render();fit();});
}

/* screen image (PNG) */
var toastT=null;
function toast(m,ms){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},ms||3000);}
function md(ms){var t=new Date(ms);return (t.getMonth()+1)+'월 '+t.getDate()+'일 ';}
function imgFoot(d){
  if(mode==='live')return '날씨 자료 Open-Meteo | '+md(d.at)+E.timeStr(d.at)+' 기준';
  if(mode==='cache')return '마지막으로 받은 날씨 | '+md(d.at)+E.timeStr(d.at);
  return '예시 날씨로 만든 화면이에요';
}
function saveBlob(name,blob){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},5000);
}
$('snapBtn').addEventListener('click',function(){
  if(busy)return;busy=true;
  var btn=$('snapBtn'),lab=$('snapLab');btn.disabled=true;lab.textContent='만드는 중...';
  var d=cur();
  E.snap(D,d,{foot:imgFoot(d)}).then(function(blobs){
    var names=E.snapNames(D,blobs.length);
    blobs.forEach(function(b,i){setTimeout(function(){saveBlob(names[i],b);},i*700);});
    toast(blobs.length>1?'화면 이미지 2장을 저장했어요 ('+names[0]+', '+names[1]+')':'화면 이미지를 저장했어요 ('+names[0]+')',4200);
  }).catch(function(){
    toast('이미지를 만들지 못했어요. 인터넷에 연결되어 있는지 확인해 주세요',4200);
  }).then(function(){busy=false;btn.disabled=false;lab.textContent='화면 이미지 저장';});
});

var c0=readCache();if(c0){data=c0;mode='cache';}
render();fit();load();
addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
setInterval(load,600000);
setInterval(render,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-lastLoad>300000)load();});
addEventListener('online',load);
})();

</script>
</body>
</html>
